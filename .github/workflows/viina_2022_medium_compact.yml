name: VIINA 2022 Medium Compact
on:
  push:
    paths:
      - 'scripts/compact_viina_2022_medium_priority.py'
      - '.github/workflows/viina_2022_medium_compact.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Create compact medium-priority review file
        run: |
          python scripts/compact_viina_2022_medium_priority.py \
            --input output/VIINA_2022_R5_SECOND_STAGE_V3.csv \
            --output output/VIINA_2022_R5_MEDIUM_PRIORITY_V3_COMPACT.csv
      - name: Commit compact output
        run: |
          git add output/VIINA_2022_R5_MEDIUM_PRIORITY_V3_COMPACT.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record VIINA 2022 medium-priority compact review'
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
