name: Triage VIINA 2022 completeness review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/triage_viina_2022.py"
      - ".github/workflows/viina_2022_triage.yml"

concurrency:
  group: viina-2022-triage-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run 2022 review triage
        shell: bash
        run: |
          set -euo pipefail
          python scripts/triage_viina_2022.py \
            --input output/VIINA_2022_REBUILD.csv \
            --output output/VIINA_2022_TRIAGE.csv \
            --priority-output output/VIINA_2022_PRIORITY_RUSSIA.csv \
            --summary output/VIINA_2022_TRIAGE_SUMMARY.txt \
            --matrix output/DEEP_COMPLETENESS_REBUILD_MATRIX_2022_2026.csv
          test -s output/VIINA_2022_TRIAGE.csv
          test -s output/VIINA_2022_TRIAGE_SUMMARY.txt
          cat output/VIINA_2022_TRIAGE_SUMMARY.txt

      - name: Commit triage outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            output/VIINA_2022_TRIAGE.csv \
            output/VIINA_2022_PRIORITY_RUSSIA.csv \
            output/VIINA_2022_TRIAGE_SUMMARY.txt \
            output/DEEP_COMPLETENESS_REBUILD_MATRIX_2022_2026.csv
          if git diff --cached --quiet; then
            echo "No triage changes."
            exit 0
          fi
          git commit -m "Record VIINA 2022 review triage"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Triage push failed after 3 attempts" >&2
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
