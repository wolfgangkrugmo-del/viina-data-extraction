name: Close VIINA 2025 matrix row

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/close_viina_2025_matrix_row.py'
      - '.github/workflows/close_viina_2025_matrix.yml'

permissions:
  contents: write

concurrency:
  group: viina-import-main
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Close 2025 row
        run: python scripts/close_viina_2025_matrix_row.py
      - name: Verify closure
        run: |
          python - <<'PY'
          import csv
          p='output/DEEP_COMPLETENESS_REBUILD_MATRIX_2022_2026.csv'
          with open(p,encoding='utf-8',newline='') as f:
              r=next(x for x in csv.DictReader(f) if x['MatrixRowID']=='SRC-2025-VIINA')
          assert r['SearchStatus']=='COMPLETED',r
          assert r['CoverageStatus']=='FULL_PROTOCOL',r
          assert r['UnresolvedRows']=='0',r
          assert r['ReviewStatus']=='COMPLETE',r
          assert r['DedupeReviewStatus']=='COMPLETE',r
          assert r['CandidateCensusComplete']=='FALSE',r
          print('verified SRC-2025-VIINA COMPLETED/FULL_PROTOCOL/0/COMPLETE/COMPLETE')
          PY
      - name: Commit closure
        run: |
          set -euo pipefail
          git add output/DEEP_COMPLETENESS_REBUILD_MATRIX_2022_2026.csv
          git diff --cached --quiet && exit 0
          git commit -m 'Close VIINA 2025 completeness lane'
          for i in 1 2 3; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
