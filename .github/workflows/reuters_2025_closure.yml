name: Reuters 2025 Candidate Closure

on:
  push:
    paths:
      - 'scripts/build_reuters_2025_closure.py'
      - 'scripts/update_reuters_2025_matrix_status.py'
      - 'scripts/audit_reuters_2025_86_101_bridge.py'
      - 'output/REUTERS_2025_FINAL_DISPOSITION_9_V1.csv'
      - 'output/REUTERS_2025_PROVENANCE_LINKAGE_5_V1.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build mandatory-schema ledger and audit
        run: python scripts/build_reuters_2025_closure.py
      - name: Build 86-to-101 bridge diagnostics
        run: python scripts/audit_reuters_2025_86_101_bridge.py
      - name: Apply audited Reuters status to master matrix
        run: python scripts/update_reuters_2025_matrix_status.py
      - name: Verify generated files and matrix guardrail
        run: |
          test -s output/REUTERS_2025_CANDIDATE_DEDUPE_LEDGER_V1.csv
          test -s output/REUTERS_2025_CLOSURE_FORMAL_AUDIT_V3.txt
          test -s output/REUTERS_2025_CANDIDATE_LEDGER_CLOSURE_STATUS_V3.txt
          test -s output/REUTERS_2025_86_101_CELL_DIAGNOSTIC_V1.csv
          test -s output/REUTERS_2025_86_101_ROW_DIAGNOSTIC_V1.csv
          python - <<'PY'
          import csv
          p='output/REUTERS_2025_CANDIDATE_DEDUPE_LEDGER_V1.csv'
          with open(p,encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==105, len(rows)
          assert all(r['ReviewStatus']=='COMPLETE' for r in rows)
          assert all(r['InclusionStatus'] for r in rows)
          assert all(r['DedupeDecision'] for r in rows)
          m='output/DEEP_COMPLETENESS_REBUILD_MATRIX_2022_2026.csv'
          with open(m,encoding='utf-8',newline='') as f:
              mr=[r for r in csv.DictReader(f) if r['MatrixRowID']=='SRC-2025-REUTERS']
          assert len(mr)==1
          r=mr[0]
          assert r['ReviewStatus']=='COMPLETE'
          assert r['DedupeReviewStatus']=='COMPLETE'
          assert r['CandidateCensusComplete']=='FALSE'
          print('verified ledger rows=',len(rows),'matrix acceptance=',r['RowAcceptanceStatus'])
          PY
      - name: Commit generated closure artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/REUTERS_2025_CANDIDATE_DEDUPE_LEDGER_V1.csv output/REUTERS_2025_CLOSURE_FORMAL_AUDIT_V3.txt output/REUTERS_2025_CANDIDATE_LEDGER_CLOSURE_STATUS_V3.txt output/REUTERS_2025_86_101_CELL_DIAGNOSTIC_V1.csv output/REUTERS_2025_86_101_ROW_DIAGNOSTIC_V1.csv output/DEEP_COMPLETENESS_REBUILD_MATRIX_2022_2026.csv
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Update Reuters 2025 closure and bridge diagnostics'
            git push
          fi
