name: VIINA 2022 R5 second-stage reduction

on:
  push:
    branches: [main]
    paths:
      - 'scripts/reduce_viina_2022_r5_unknown.py'
      - '.github/workflows/viina_2022_r5_reduce.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viina-2022-r5-reduce-main
  cancel-in-progress: true

jobs:
  reduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run second-stage reduction
        run: |
          python3 scripts/reduce_viina_2022_r5_unknown.py \
            --input output/VIINA_2022_POST_DEDUPE_RETRIAGE_V2.csv \
            --output output/VIINA_2022_R5_SECOND_STAGE_V3.csv \
            --high-output output/VIINA_2022_R5_HIGH_PRIORITY_V3.csv \
            --summary output/VIINA_2022_R5_SECOND_STAGE_V3_SUMMARY.txt
      - name: Commit outputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add output/VIINA_2022_R5_SECOND_STAGE_V3.csv output/VIINA_2022_R5_HIGH_PRIORITY_V3.csv output/VIINA_2022_R5_SECOND_STAGE_V3_SUMMARY.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record VIINA 2022 R5 second-stage reduction'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
