name: VIINA 2022 Low Residual Audit
on:
  push:
    paths:
      - 'scripts/audit_viina_2022_low_priority_residuals.py'
      - '.github/workflows/viina_2022_low_residual_audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run residual audit
        run: |
          python scripts/audit_viina_2022_low_priority_residuals.py \
            --input output/VIINA_2022_R5_SECOND_STAGE_V3.csv \
            --output output/VIINA_2022_LOW_PRIORITY_RESIDUAL_AUDIT_V1.csv \
            --summary output/VIINA_2022_LOW_PRIORITY_RESIDUAL_AUDIT_V1_SUMMARY.txt
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/VIINA_2022_LOW_PRIORITY_RESIDUAL_AUDIT_V1.csv output/VIINA_2022_LOW_PRIORITY_RESIDUAL_AUDIT_V1_SUMMARY.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit VIINA 2022 low-priority residuals'
          git pull --rebase origin main
          git push origin HEAD:main
