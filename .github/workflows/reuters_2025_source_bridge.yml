name: Reuters 2025 Source Bridge

on:
  push:
    paths:
      - 'scripts/build_reuters_2025_source_manifest_bridge.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-source-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source manifest and 101-row bridge
        run: python scripts/build_reuters_2025_source_manifest_bridge.py
      - name: Verify guardrails
        run: |
          test -s output/REUTERS_2025_SOURCE_COMPONENT_MANIFEST_V1.csv
          test -s output/REUTERS_2025_101_ROW_BRIDGE_V1.csv
          test -s output/REUTERS_2025_SOURCE_BRIDGE_FORMAL_AUDIT_V1.txt
          python - <<'PY'
          import csv
          with open('output/REUTERS_2025_SOURCE_COMPONENT_MANIFEST_V1.csv',encoding='utf-8',newline='') as f:
              m=list(csv.DictReader(f))
          with open('output/REUTERS_2025_101_ROW_BRIDGE_V1.csv',encoding='utf-8',newline='') as f:
              b=list(csv.DictReader(f))
          assert len(m)==86, len(m)
          assert len(b)==101, len(b)
          allowed={'1:1','Split','Follow-up','VIINA-Zusatz','OSC-Routing','Korrektur','Non-Candidate'}
          assert all(r['TransformationClass'] in allowed for r in b)
          print('manifest=',len(m),'bridge=',len(b))
          PY
      - name: Commit source bridge artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add output/REUTERS_2025_SOURCE_COMPONENT_MANIFEST_V1.csv output/REUTERS_2025_101_ROW_BRIDGE_V1.csv output/REUTERS_2025_SOURCE_BRIDGE_FORMAL_AUDIT_V1.txt
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Generate Reuters 2025 86-component source manifest and bridge'
            git push
          fi
