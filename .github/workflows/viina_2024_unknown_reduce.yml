name: VIINA 2024 unknown reduction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/reduce_viina_2024_unknown.py'
      - '.github/workflows/viina_2024_unknown_reduce.yml'

permissions:
  contents: write

concurrency:
  group: viina-2024-unknown-reduce-main
  cancel-in-progress: true

jobs:
  reduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prioritize 120 unknown rows
        run: |
          python scripts/reduce_viina_2024_unknown.py \
            --input output/VIINA_2024_POST_EXACT_DEDUPE_REVIEW.csv \
            --output output/VIINA_2024_UNKNOWN_REDUCTION_V2.csv \
            --high-output output/VIINA_2024_UNKNOWN_HIGH_PRIORITY_V2.csv \
            --summary output/VIINA_2024_UNKNOWN_REDUCTION_V2_SUMMARY.txt
          cat output/VIINA_2024_UNKNOWN_REDUCTION_V2_SUMMARY.txt
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/VIINA_2024_UNKNOWN_REDUCTION_V2.csv output/VIINA_2024_UNKNOWN_HIGH_PRIORITY_V2.csv output/VIINA_2024_UNKNOWN_REDUCTION_V2_SUMMARY.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Prioritize VIINA 2024 unknown-scope rows'
          for i in 1 2 3; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            sleep 2
          done
          exit 1
