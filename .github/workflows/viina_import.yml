name: Build VIINA deep-strike candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/viina_import.yml"
      - "README.md"
      - "LICENSE-DATA.md"

concurrency:
  group: viina-import-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Persist runner start marker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p output
          echo "runner_started_utc=$(date -u +%FT%TZ)" > output/RUNNER_STARTED.txt
          echo "trigger_head_sha=${GITHUB_SHA}" >> output/RUNNER_STARTED.txt
          echo "run_id=${GITHUB_RUN_ID}" >> output/RUNNER_STARTED.txt
          git add output/RUNNER_STARTED.txt
          if git diff --cached --quiet; then
            echo "Runner marker unchanged."
          else
            git commit -m "Record VIINA runner start"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Marker push failed after 3 attempts" >&2
                exit 1
              fi
              git fetch origin main
              git rebase origin/main
            done
          fi

      - name: Download GeoNames Russia gazetteer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp output
          curl --fail --location --retry 3 https://download.geonames.org/export/dump/RU.zip -o tmp/RU.zip
          unzip -t tmp/RU.zip >/dev/null

      - name: Preflight Russia location gate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preflight_geonames.py \
            --ru-geonames tmp/RU.zip \
            --output output/GEONAMES_PREFLIGHT.txt
          test -s output/GEONAMES_PREFLIGHT.txt
          cat output/GEONAMES_PREFLIGHT.txt

      - name: Persist preflight result
        shell: bash
        run: |
          set -euo pipefail
          git add output/GEONAMES_PREFLIGHT.txt
          if git diff --cached --quiet; then
            echo "Preflight unchanged."
          else
            git commit -m "Record GeoNames location preflight"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Preflight push failed after 3 attempts" >&2
                exit 1
              fi
              git fetch origin main
              git rebase origin/main
            done
          fi

      - name: Clone VIINA
        shell: bash
        run: |
          set -euo pipefail
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 https://github.com/zhukovyuri/VIINA.git viina
          git -C viina lfs install --local

      - name: Pull required VIINA archives only
        shell: bash
        run: |
          set -euo pipefail
          include=""
          for y in 2022 2023 2024 2025 2026; do
            [ -z "$include" ] || include="${include},"
            include="${include}Data/event_info_latest_${y}.zip,Data/event_1pd_latest_${y}.zip"
          done
          git -C viina lfs pull --include="$include" --exclude=""
          for y in 2022 2023 2024 2025 2026; do
            unzip -t "viina/Data/event_info_latest_${y}.zip" >/dev/null
            unzip -t "viina/Data/event_1pd_latest_${y}.zip" >/dev/null
          done

      - name: Diagnose pipeline stages
        shell: bash
        run: |
          set -euo pipefail
          python scripts/diagnose_viina_pipeline.py \
            --viina-data-dir viina/Data \
            --ru-geonames tmp/RU.zip \
            --output output/PIPELINE_DIAGNOSTIC.txt
          test -s output/PIPELINE_DIAGNOSTIC.txt

      - name: Build strict and review candidate CSVs
        shell: bash
        run: |
          set -euo pipefail
          python scripts/filter_viina.py \
            --viina-data-dir viina/Data \
            --ru-geonames tmp/RU.zip \
            --output output/viina_deep_strike_candidates.csv \
            --review-output output/viina_deep_strike_location_review.csv
          test -s output/viina_deep_strike_candidates.csv
          test -s output/viina_deep_strike_location_review.csv
          wc -l output/viina_deep_strike_candidates.csv
          wc -l output/viina_deep_strike_location_review.csv

      - name: Classify review cases
        shell: bash
        run: |
          set -euo pipefail
          python scripts/classify_review.py \
            --input output/viina_deep_strike_location_review.csv \
            --output output/viina_review_classified.csv \
            --summary output/VIINA_REVIEW_SUMMARY.txt
          test -s output/viina_review_classified.csv
          test -s output/VIINA_REVIEW_SUMMARY.txt
          cat output/VIINA_REVIEW_SUMMARY.txt

      - name: Write provenance
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "generated_at_utc=$(date -u +%FT%TZ)"
            echo "viina_commit=$(git -C viina rev-parse HEAD)"
            echo "study_start=2022-02-24"
            echo "study_end=2026-06-30"
            echo "source_repo=https://github.com/zhukovyuri/VIINA"
            echo "strict_rule=ukrainian_initiator AND hierarchical_RU_location_gate; Crimea review-only"
            echo "review_rule=EVENT_GATE>PROMOTE_RUSSIA>CRIMEA>UNRESOLVED; PROMOTE_RUSSIA remains census-candidate only"
            sha256sum \
              output/viina_deep_strike_candidates.csv \
              output/viina_deep_strike_location_review.csv \
              output/viina_review_classified.csv \
              output/VIINA_REVIEW_SUMMARY.txt \
              output/PIPELINE_DIAGNOSTIC.txt \
              output/GEONAMES_PREFLIGHT.txt
          } > output/PROVENANCE.txt

      - name: Commit derived output and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git add \
            output/viina_deep_strike_candidates.csv \
            output/viina_deep_strike_location_review.csv \
            output/viina_review_classified.csv \
            output/VIINA_REVIEW_SUMMARY.txt \
            output/PIPELINE_DIAGNOSTIC.txt \
            output/GEONAMES_PREFLIGHT.txt \
            output/PROVENANCE.txt
          if git diff --cached --quiet; then
            echo "No output changes."
          else
            git commit -m "Classify VIINA review candidates"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Final output push failed after 3 attempts" >&2
                exit 1
              fi
              git fetch origin main
              git rebase origin/main
            done
          fi
